name: Release

# Push a version tag (v0.1.0) to package macOS, Linux, and Windows installers
# and attach them to a GitHub Release. workflow_dispatch builds artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  models:
    name: Fetch bundled models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: resources/models
          key: models-${{ hashFiles('src/library/models.ts') }}

      - name: Download allowlisted model files
        run: node --experimental-strip-types scripts/fetch-models.ts

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-models
          path: resources/models
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: models
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            builder: "--mac"
            artifact: Doorei-mac
          - os: ubuntu-latest
            name: Linux
            builder: "--linux"
            artifact: Doorei-linux
          - os: windows-latest
            name: Windows
            builder: "--win"
            artifact: Doorei-windows
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore bundled models
        uses: actions/download-artifact@v4
        with:
          name: bundled-models
          path: resources/models

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging version $VERSION"
          VERSION="$VERSION" node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs'
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
            pkg.version = process.env.VERSION
            writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        env:
          # No signing certs in CI; skip identity lookup so unsigned builds succeed.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm build && pnpm exec electron-builder ${{ matrix.builder }} --publish never

      - name: Show packaged files
        if: always()
        run: |
          df -h
          ls -lh release || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/latest*.yaml

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Doorei-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Installers are unsigned. macOS Gatekeeper will warn until the app is signed and notarized.
