name: Release

# A version tag on master (0.1.0 or v0.1.0), pushed by someone with write
# access, packages macOS, Linux, and Windows installers and attaches them to a
# GitHub Release. Forks, other branches, and manual runs do not build.
#
# Each platform builds a full first-install package (with the ~900MB model pack)
# and a slim in-app update (models omitted). The running app keeps models in
# userData, so updates download app code only.
#
# Optional code signing — add these repository secrets when you have certificates:
#   CSC_LINK / CSC_KEY_PASSWORD           macOS Developer ID .p12 (base64)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   macOS notarization
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD   Windows Authenticode .pfx (base64)
# Without them, installers are unsigned. macOS in-app update needs a signed app.
on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  authorize:
    name: Authorize release
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - name: Require write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq '.permission')"
          echo "actor=${GITHUB_ACTOR} permission=${perm}"
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "Only users with write access to this repository can create a release tag." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to point at master
        run: |
          git fetch --no-tags origin master
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "Tag ${GITHUB_REF_NAME} is on master ($(git rev-parse --short "${GITHUB_SHA}"))"
          else
            echo "Tag ${GITHUB_REF_NAME} is not on master; releases only run for master tags." >&2
            git log -1 --oneline "${GITHUB_SHA}"
            exit 1
          fi

  models:
    name: Fetch bundled models
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: resources/models
          key: models-${{ hashFiles('src/library/models.ts') }}

      - name: Download allowlisted model files
        run: node --experimental-strip-types scripts/fetch-models.ts

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-models
          path: resources/models
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: models
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            fullBuilder: "--mac dmg"
            slimBuilder: "--mac zip"
            feed: latest-mac.yml
            artifact: Doorei-mac
          - os: ubuntu-latest
            name: Linux
            fullBuilder: "--linux AppImage"
            slimBuilder: "--linux AppImage"
            feed: latest-linux.yml
            artifact: Doorei-linux
          - os: windows-latest
            name: Windows
            fullBuilder: "--win nsis"
            slimBuilder: "--win nsis"
            feed: latest.yml
            artifact: Doorei-windows
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # electron-builder extracts CJS icon-tool.js into ELECTRON_BUILDER_CACHE.
      # This repo is "type": "module", so Node treats that .js as ESM unless a
      # nearer package.json stops the walk. mac.icon is a committed .icns so
      # conversion is skipped; this still covers a PNG icon later.
      - name: Treat electron-builder cache as CommonJS
        run: |
          mkdir -p "$ELECTRON_BUILDER_CACHE"
          printf '{ "type": "commonjs" }\n' > "$ELECTRON_BUILDER_CACHE/package.json"

      - name: Restore bundled models
        uses: actions/download-artifact@v4
        with:
          name: bundled-models
          path: resources/models

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging version $VERSION"
          VERSION="$VERSION" node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs'
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
            pkg.version = process.env.VERSION
            writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package full installer
        run: pnpm exec electron-builder ${{ matrix.fullBuilder }} --publish never

      - name: Package slim update
        env:
          DOOREI_SLIM_UPDATE: "1"
        run: >
          pnpm exec electron-builder ${{ matrix.slimBuilder }} --publish never
          -c.artifactName='${productName}-${version}-${os}-update.${ext}'

      - name: Write update feed
        run: |
          VERSION=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")
          shopt -s nullglob
          artifacts=(release/*-update.zip release/*-update.exe release/*-update.AppImage)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "expected one slim update artifact, found: ${artifacts[*]-none}"
            ls -lh release || true
            exit 1
          fi
          node --experimental-strip-types scripts/write-update-yml.ts "$VERSION" "${artifacts[0]}" "release/${{ matrix.feed }}"

      - name: Show packaged files
        if: always()
        run: |
          df -h
          ls -lh release || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/latest*.yaml

  release:
    name: GitHub Release
    needs: [authorize, models, build]
    if: always() && !cancelled() && needs.authorize.result == 'success' && needs.models.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Doorei-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Download the macOS dmg, Windows Setup exe, or Linux AppImage for a first install (includes the model pack).

            Files named `*-update.*` plus `latest*.yml` are for in-app updates and omit the model pack. The app keeps models in user data, so later updates do not download them again.

            Installers are unsigned unless repository signing secrets are set. macOS Gatekeeper will warn, and macOS in-app update needs a signed app.
